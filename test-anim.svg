<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
<rect width="100%" height="100%" fill="#000000"/>
<style>
@keyframes fadeGo{from{opacity:0;}to{opacity:1;}}
.cssTest{opacity:0;animation:fadeGo 1s ease-in forwards;}
</style>
<circle class="cssTest" cx="100" cy="100" r="70" fill="red"/>
<circle cx="300" cy="100" r="70" fill="lime" opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0s" dur="1s" fill="freeze"/>
</circle>
<text x="100" y="190" fill="white" font-size="14" text-anchor="middle">CSS (red)</text>
<text x="300" y="190" fill="white" font-size="14" text-anchor="middle">SMIL (green)</text>
</svg>
